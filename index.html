<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="TiTu Shop - Online Shopping">
<title>TiTu Shop</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
}

body{
  background:#f4f7fb;
  color:#222;
}

header{
  background:linear-gradient(135deg,#111827,#2563eb);
  color:white;
  padding:18px 5%;
  position:sticky;
  top:0;
  z-index:1000;
  box-shadow:0 3px 15px #0002;
}

.nav{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  font-size:27px;
  font-weight:bold;
}

.logo span{
  color:#facc15;
}

.nav-right{
  display:flex;
  gap:8px;
  align-items:center;
}

.nav button{
  border:0;
  background:white;
  color:#1d4ed8;
  padding:10px 15px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.hero{
  background:linear-gradient(135deg,#dbeafe,#eff6ff);
  padding:55px 20px;
  text-align:center;
}

.hero h1{
  font-size:38px;
  color:#111827;
  margin-bottom:12px;
}

.hero p{
  font-size:18px;
  color:#475569;
  margin-bottom:22px;
}

.search{
  max-width:600px;
  margin:auto;
  display:flex;
}

.search input{
  width:100%;
  padding:15px;
  border:2px solid #dbeafe;
  border-radius:12px 0 0 12px;
  outline:none;
  font-size:16px;
}

.search button{
  padding:15px 20px;
  border:0;
  background:#2563eb;
  color:white;
  border-radius:0 12px 12px 0;
  cursor:pointer;
}

.container{
  max-width:1200px;
  margin:35px auto;
  padding:0 18px;
}

.section-title{
  text-align:center;
  font-size:28px;
  margin-bottom:25px;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.card{
  background:white;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 5px 20px #00000012;
  transition:.25s;
}

.card:hover{
  transform:translateY(-5px);
  box-shadow:0 10px 25px #00000020;
}

.product-img{
  width:100%;
  height:220px;
  object-fit:cover;
  background:#eee;
}

.card-body{
  padding:17px;
}

.card h3{
  margin-bottom:8px;
  font-size:19px;
}

.price{
  color:#16a34a;
  font-size:21px;
  font-weight:bold;
  margin:10px 0;
}

.desc{
  color:#64748b;
  font-size:14px;
  min-height:38px;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:15px;
}

.btn{
  border:0;
  padding:11px;
  border-radius:9px;
  cursor:pointer;
  font-weight:bold;
  flex:1;
}

.whatsapp{
  background:#22c55e;
  color:white;
}

.cart-btn{
  background:#2563eb;
  color:white;
}

.admin-btn{
  background:#111827 !important;
  color:white !important;
}

.admin-panel{
  display:none;
  background:white;
  max-width:900px;
  margin:25px auto;
  padding:25px;
  border-radius:18px;
  box-shadow:0 5px 25px #0002;
}

.admin-panel h2{
  margin-bottom:20px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.form-group{
  margin-bottom:12px;
}

.form-group.full{
  grid-column:1/-1;
}

.form-group label{
  display:block;
  margin-bottom:5px;
  font-weight:bold;
}

.form-group input,
.form-group textarea{
  width:100%;
  padding:12px;
  border:1px solid #cbd5e1;
  border-radius:9px;
  outline:none;
}

.form-group textarea{
  min-height:90px;
  resize:vertical;
}

.admin-actions{
  display:flex;
  gap:10px;
  margin-top:10px;
}

.admin-actions button{
  border:0;
  padding:12px 18px;
  border-radius:9px;
  cursor:pointer;
  font-weight:bold;
}

.save{
  background:#16a34a;
  color:white;
}

.cancel{
  background:#64748b;
  color:white;
}

.admin-products{
  margin-top:30px;
}

.admin-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:12px;
  border:1px solid #e2e8f0;
  border-radius:10px;
  margin-bottom:10px;
}

.admin-item-info{
  flex:1;
}

.edit{
  background:#f59e0b;
  color:white;
  border:0;
  padding:8px 12px;
  border-radius:7px;
  cursor:pointer;
}

.delete{
  background:#dc2626;
  color:white;
  border:0;
  padding:8px 12px;
  border-radius:7px;
  cursor:pointer;
}

.empty{
  text-align:center;
  padding:40px;
  color:#64748b;
}

footer{
  margin-top:50px;
  background:#111827;
  color:white;
  text-align:center;
  padding:30px 15px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  z-index:3000;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal-box{
  background:white;
  width:100%;
  max-width:450px;
  padding:25px;
  border-radius:18px;
}

.modal-box h2{
  margin-bottom:15px;
}

.modal-box input{
  width:100%;
  padding:13px;
  border:1px solid #cbd5e1;
  border-radius:9px;
  margin:10px 0;
}

.modal-box button{
  width:100%;
  padding:12px;
  border:0;
  border-radius:9px;
  background:#2563eb;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.close{
  background:#64748b !important;
  margin-top:8px;
}

.cart{
  display:none;
  position:fixed;
  right:15px;
  top:80px;
  width:350px;
  max-width:calc(100% - 30px);
  background:white;
  z-index:2000;
  border-radius:18px;
  box-shadow:0 10px 35px #0004;
  padding:20px;
}

.cart h2{
  margin-bottom:15px;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:10px 0;
  border-bottom:1px solid #eee;
}

.cart-total{
  font-size:20px;
  font-weight:bold;
  margin:15px 0;
}

.checkout{
  width:100%;
  padding:13px;
  background:#22c55e;
  color:white;
  border:0;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

@media(max-width:600px){
  .hero h1{
    font-size:29px;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .form-group.full{
    grid-column:auto;
  }

  .logo{
    font-size:22px;
  }

  .nav button{
    padding:8px 10px;
    font-size:12px;
  }

  .admin-item{
    flex-wrap:wrap;
  }
}
</style>
</head>

<body>

<header>
  <div class="nav">
    <div class="logo">Ti<span>Tu</span> Shop</div>

    <div class="nav-right">
      <button onclick="toggleCart()">🛒 Cart <span id="cartCount">0</span></button>
      <button class="admin-btn" onclick="openAdmin()">⚙️ Admin</button>
    </div>
  </div>
</header>

<section class="hero">
  <h1>🛍️ Welcome to TiTu Shop</h1>
  <p>আপনার পছন্দের পণ্য এখন এক জায়গায়</p>

  <div class="search">
    <input
      type="text"
      id="searchInput"
      placeholder="পণ্য খুঁজুন..."
      oninput="showProducts()"
    >
    <button onclick="showProducts()">🔍</button>
  </div>
</section>

<section class="container">

  <h2 class="section-title">🔥 Our Products</h2>

  <div id="products" class="products"></div>

</section>

<!-- ADMIN PANEL -->

<section id="adminPanel" class="admin-panel">

  <h2>⚙️ TiTu Shop Admin Panel</h2>

  <div class="form-grid">

    <div class="form-group">
      <label>Product Name</label>
      <input id="productName" placeholder="যেমন: Smart Watch">
    </div>

    <div class="form-group">
      <label>Price (৳)</label>
      <input id="productPrice" type="number" placeholder="1290">
    </div>

    <div class="form-group full">
      <label>Image URL</label>
      <input id="productImage" placeholder="https://example.com/image.jpg">
    </div>

    <div class="form-group full">
      <label>Description</label>
      <textarea id="productDesc" placeholder="পণ্যের বিবরণ লিখুন"></textarea>
    </div>

  </div>

  <div class="admin-actions">

    <button class="save" onclick="saveProduct()">
      💾 Save Product
    </button>

    <button class="cancel" onclick="resetForm()">
      ❌ Cancel
    </button>

  </div>

  <div class="admin-products">
    <h3>📦 Manage Products</h3>
    <br>
    <div id="adminProducts"></div>
  </div>

</section>

<!-- CART -->

<div id="cart" class="cart">

  <h2>🛒 Your Cart</h2>

  <div id="cartItems"></div>

  <div class="cart-total">
    Total: ৳<span id="cartTotal">0</span>
  </div>

  <button class="checkout" onclick="checkoutWhatsApp()">
    📲 WhatsApp এ অর্ডার করুন
  </button>

</div>

<!-- ADMIN LOGIN -->

<div id="loginModal" class="modal">

  <div class="modal-box">

    <h2>🔐 Admin Login</h2>

    <p>Admin Password দিন</p>

    <input
      type="password"
      id="adminPassword"
      placeholder="Password"
    >

    <button onclick="loginAdmin()">
      Login
    </button>

    <button class="close" onclick="closeLogin()">
      Cancel
    </button>

  </div>

</div>

<footer>
  <h3>TiTu Shop</h3>
  <p>Quality Products • Fast Delivery • Easy Ordering</p>
  <br>
  <p>© 2026 TiTu Shop. All Rights Reserved.</p>
</footer>

<script>

/* =========================
   SETTINGS
========================= */

const WHATSAPP_NUMBER = "8801970765919";

const ADMIN_PASSWORD = "1234";


/* =========================
   DEFAULT PRODUCTS
========================= */

let products = JSON.parse(localStorage.getItem("tituProducts")) || [

  {
    id:1,
    name:"Smart Watch",
    price:1290,
    image:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600",
    desc:"সুন্দর ও আধুনিক Smart Watch"
  },

  {
    id:2,
    name:"Bluetooth Earbuds",
    price:850,
    image:"https://images.unsplash.com/photo-1606220945770-b5b6c2c55bf1?w=600",
    desc:"High quality wireless earbuds"
  },

  {
    id:3,
    name:"Fashion Sunglasses",
    price:650,
    image:"https://images.unsplash.com/photo-1511499767150-a48a237f0083?w=600",
    desc:"Stylish sunglasses"
  },

  {
    id:4,
    name:"Mobile Holder",
    price:350,
    image:"https://images.unsplash.com/photo-1609592424811-6f1f4b8a5b26?w=600",
    desc:"Strong mobile phone holder"
  }

];

let cart = [];

let editingId = null;


/* =========================
   SAVE PRODUCTS
========================= */

function saveProducts(){

  localStorage.setItem(
    "tituProducts",
    JSON.stringify(products)
  );

}


/* =========================
   SHOW PRODUCTS
========================= */

function showProducts(){

  const container =
    document.getElementById("products");

  const search =
    document.getElementById("searchInput")
    .value
    .toLowerCase();

  const filtered =
    products.filter(p =>
      p.name.toLowerCase().includes(search)
    );

  if(filtered.length === 0){

    container.innerHTML =
      '<div class="empty">😔 কোনো পণ্য পাওয়া যায়নি</div>';

    return;

  }

  container.innerHTML =
    filtered.map(p => `

      <div class="card">

        <img
          class="product-img"
          src="${p.image}"
          onerror="this.src='https://via.placeholder.com/600x400?text=TiTu+Shop'"
        >

        <div class="card-body">

          <h3>${p.name}</h3>

          <div class="price">
            ৳${Number(p.price).toLocaleString()}
          </div>

          <p class="desc">
            ${p.desc}
          </p>

          <div class="actions">

            <button
              class="btn whatsapp"
              onclick="orderProduct(${p.id})"
            >
              📲 Order
            </button>

            <button
              class="btn cart-btn"
              onclick="addToCart(${p.id})"
            >
              🛒 Cart
            </button>

          </div>

        </div>

      </div>

    `).join("");

}


/* =========================
   WHATSAPP SINGLE PRODUCT
========================= */

function orderProduct(id){

  const product =
    products.find(p => p.id === id);

  if(!product) return;

  const message =
`🛍️ TiTu Shop Order

📦 Product: ${product.name}
💰 Price: ৳${product.price}
📦 Quantity: 1

👤 Customer Name:
📱 Phone Number:
📍 Delivery Address:

আমি এই পণ্যটি অর্ডার করতে চাই।`;

  const url =
    "https://wa.me/" +
    WHATSAPP_NUMBER +
    "?text=" +
    encodeURIComponent(message);

  window.open(url,"_blank");

}


/* =========================
   CART
========================= */

function addToCart(id){

  const product =
    products.find(p => p.id === id);

  if(!product) return;

  cart.push(product);

  updateCart();

  alert("✅ পণ্যটি Cart-এ যোগ হয়েছে!");

}


function updateCart(){

  document.getElementById("cartCount")
    .innerText = cart.length;

  const items =
    document.getElementById("cartItems");

  if(cart.length === 0){

    items.innerHTML =
      '<div class="empty">Cart খালি</div>';

    document.getElementById("cartTotal")
      .innerText = "0";

    return;

  }

  let total = 0;

  items.innerHTML =
    cart.map((p,index) => {

      total += Number(p.price);

      return `

        <div class="cart-item">

          <span>
            ${p.name}
            <br>
            <b>৳${p.price}</b>
          </span>

          <button
            onclick="removeCart(${index})"
            style="border:0;background:#dc2626;color:white;padding:6px;border-radius:6px;"
          >
            ✕
          </button>

        </div>

      `;

    }).join("");

  document.getElementById("cartTotal")
    .innerText = total.toLocaleString();

}


function removeCart(index){

  cart.splice(index,1);

  updateCart();

}


function toggleCart(){

  const cartBox =
    document.getElementById("cart");

  cartBox.style.display =
    cartBox.style.display === "block"
    ? "none"
    : "block";

}


/* =========================
   CART WHATSAPP CHECKOUT
========================= */

function checkoutWhatsApp(){

  if(cart.length === 0){

    alert("❌ আপনার Cart খালি!");

    return;

  }

  let total = 0;

  let productText = "";

  cart.forEach((p,index) => {

    total += Number(p.price);

    productText +=
      `${index+1}. ${p.name} - ৳${p.price}\n`;

  });

  const message =
`🛍️ TiTu Shop Order

📦 Products:
${productText}

💰 Total: ৳${total}

👤 Customer Name:
📱 Phone Number:
📍 Delivery Address:

আমি এই অর্ডারটি করতে চাই।`;

  const url =
    "https://wa.me/" +
    WHATSAPP_NUMBER +
    "?text=" +
    encodeURIComponent(message);

  window.open(url,"_blank");

}


/* =========================
   ADMIN LOGIN
========================= */

function openAdmin(){

  document.getElementById("loginModal")
    .style.display = "flex";

}


function closeLogin(){

  document.getElementById("loginModal")
    .style.display = "none";

}


function loginAdmin(){

  const password =
    document.getElementById("adminPassword").value;

  if(password === ADMIN_PASSWORD){

    closeLogin();

    document.getElementById("adminPanel")
      .style.display = "block";

    renderAdminProducts();

    window.scrollTo({
      top:document.getElementById("adminPanel")
        .offsetTop - 80,
      behavior:"smooth"
    });

    document.getElementById("adminPassword")
      .value = "";

  }else{

    alert("❌ ভুল Password!");

  }

}


/* =========================
   ADMIN PRODUCT LIST
========================= */

function renderAdminProducts(){

  const box =
    document.getElementById("adminProducts");

  if(products.length === 0){

    box.innerHTML =
      '<div class="empty">কোনো Product নেই</div>';

    return;

  }

  box.innerHTML =
    products.map(p => `

      <div class="admin-item">

        <div class="admin-item-info">

          <b>${p.name}</b>

          <br>

          <span>
            ৳${Number(p.price).toLocaleString()}
          </span>

        </div>

        <button
          class="edit"
          onclick="editProduct(${p.id})"
        >
          ✏️ Edit
        </button>

        <button
          class="delete"
          onclick="deleteProduct(${p.id})"
        >
          🗑️ Delete
        </button>

      </div>

    `).join("");

}


/* =========================
   ADD / EDIT PRODUCT
========================= */

function saveProduct(){

  const name =
    document.getElementById("productName").value.trim();

  const price =
    document.getElementById("productPrice").value;

  const image =
    document.getElementById("productImage").value.trim();

  const desc =
    document.getElementById("productDesc").value.trim();

  if(!name || !price){

    alert("⚠️ Product Name এবং Price দিন!");

    return;

  }

  if(editingId){

    const product =
      products.find(p => p.id === editingId);

    product.name = name;
    product.price = Number(price);
    product.image = image ||
      "https://via.placeholder.com/600x400?text=TiTu+Shop";
    product.desc = desc;

    alert("✅ Product Updated!");

  }else{

    const newProduct = {

      id:Date.now(),

      name:name,

      price:Number(price),

      image:image ||
        "https://via.placeholder.com/600x400?text=TiTu+Shop",

      desc:desc

    };

    products.push(newProduct);

    alert("✅ Product Added!");

  }

  saveProducts();

  resetForm();

  showProducts();

  renderAdminProducts();

}


/* =========================
   EDIT PRODUCT
========================= */

function editProduct(id){

  const p =
    products.find(product => product.id === id);

  if(!p) return;

  editingId = id;

  document.getElementById("productName")
    .value = p.name;

  document.getElementById("productPrice")
    .value = p.price;

  document.getElementById("productImage")
    .value = p.image;

  document.getElementById("productDesc")
    .value = p.desc;

  window.scrollTo({
    top:document.getElementById("adminPanel")
      .offsetTop - 80,
    behavior:"smooth"
  });

}


/* =========================
   DELETE PRODUCT
========================= */

function deleteProduct(id){

  const p =
    products.find(product => product.id === id);

  if(!p) return;

  const confirmDelete =
    confirm(
      `আপনি কি "${p.name}" Delete করতে চান?`
    );

  if(!confirmDelete) return;

  products =
    products.filter(product => product.id !== id);

  saveProducts();

  showProducts();

  renderAdminProducts();

  alert("🗑️ Product Deleted!");

}


/* =========================
   RESET FORM
========================= */

function resetForm(){

  editingId = null;

  document.getElementById("productName")
    .value = "";

  document.getElementById("productPrice")
    .value = "";

  document.getElementById("productImage")
    .value = "";

  document.getElementById("productDesc")
    .value = "";

}


/* =========================
   START
========================= */

showProducts();

updateCart();

</script>

</body>
</html>
